<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Мой заповедник</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: full-screen 3D island; glass HUD in the corners, animal card + care actions docked at the bottom. Single warm-forest look. */
:root {
  color-scheme: light;
  --ink: #23301f;
  --ink-soft: #5d6b54;
  --glass: rgba(255, 250, 238, .8);
  --glass-strong: rgba(255, 250, 238, .96);
  --edge: rgba(255, 255, 255, .7);
  --amber: #e8962e;
  --amber-deep: #b86a12;
  --moss: #5f8a3a;
  --sky-top: #cfe6c8;
  --sky-bottom: #f4e7c8;
  --good: #5f9b3d; --warn: #e3a12f; --bad: #d4553c; --heart: #e2574a;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --shadow: 0 10px 30px rgba(40, 52, 30, .18), 0 2px 6px rgba(40, 52, 30, .12);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: linear-gradient(var(--sky-top), var(--sky-bottom)); color: var(--ink); font-family: var(--body); -webkit-tap-highlight-color: transparent; user-select: none; }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
button, input { font-family: var(--body); color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border: 1px solid var(--edge); box-shadow: var(--shadow); }
.ico { width: 22px; height: 22px; flex: none; }

/* ---------- top bar ---------- */
.hud-top { position: fixed; z-index: 10; top: calc(env(safe-area-inset-top) + 12px); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
.hud-top > * { pointer-events: auto; }
.profile { display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px; border-radius: 22px; min-width: 0; }
.lvl-ring { position: relative; width: 52px; height: 52px; flex: none; }
.lvl-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.lvl-ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 17px; }
.profile .name { font-family: var(--display); font-weight: 700; font-size: 15px; white-space: nowrap; }
.profile .sub { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.res { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.pill { display: flex; align-items: center; gap: 7px; padding: 6px 6px 6px 9px; border-radius: 999px; font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; border: 1px solid var(--edge); cursor: pointer; }
.pill .ico { width: 24px; height: 24px; }
.pill .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--amber); color: #fff; display: grid; place-items: center; font-size: 17px; line-height: 1; }
.pill.bump { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.15); } }
.clock { display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border-radius: 18px; font-weight: 900; font-size: 13px; margin-top: 8px; width: max-content; }
.clock .ico { width: 22px; height: 22px; }
.clock small { color: var(--ink-soft); font-weight: 800; }
.left-col { display: flex; flex-direction: column; min-width: 0; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin: 6px 0 14px; }
.day { border-radius: 12px; padding: 8px 2px; text-align: center; font-size: 11px; font-weight: 900; background: rgba(35, 48, 31, .07); color: var(--ink-soft); display: grid; gap: 2px; justify-items: center; }
.day .ico { width: 18px; height: 18px; }
.day.got { background: rgba(95, 155, 61, .18); color: var(--good); }
.day.now { background: var(--amber); color: #fff; }
.status { grid-column: 1 / -1; font-size: 12px; font-weight: 800; color: var(--amber-deep); display: flex; align-items: center; gap: 6px; }
.status .ico { width: 14px; height: 14px; }
.bubble.sleep { font-family: var(--display); font-weight: 700; font-size: 14px; color: #6a7ab8; }
.icon-btn { width: 44px; height: 44px; border-radius: 16px; border: 0; display: grid; place-items: center; cursor: pointer; }
.icon-btn .ico { color: var(--amber-deep); }

/* ---------- side dock ---------- */
.dock { position: fixed; z-index: 10; left: max(12px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 24px; }
.dock button { position: relative; width: 66px; border: 0; background: transparent; border-radius: 16px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; cursor: pointer; transition: background .2s; }
.dock button:hover, .dock button.on { background: rgba(232, 150, 46, .16); }
.dock .ico { width: 26px; height: 26px; color: var(--amber-deep); }
.badge { position: absolute; top: 2px; right: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 900; display: grid; place-items: center; padding: 0 5px; border: 2px solid var(--glass-strong); }

/* ---------- bottom ---------- */
.hud-bottom { position: fixed; z-index: 10; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: calc(env(safe-area-inset-bottom) + 12px); display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(0, 560px) minmax(max-content, 1fr); align-items: end; gap: 12px; pointer-events: none; }
.hud-bottom .round { justify-self: end; }
.hud-bottom .loc { justify-self: start; }
.hud-bottom > * { pointer-events: auto; }
.loc { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 20px; border: 0; cursor: pointer; text-align: left; }
.loc .thumb { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--moss); color: #fff; flex: none; }
.loc b { display: block; font-family: var(--display); font-size: 13px; }
.loc span { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.card { width: min(540px, 100%); border-radius: 22px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
.card.empty { grid-template-columns: 1fr; text-align: center; color: var(--ink-soft); font-weight: 800; font-size: 14px; }
.card .avatar { grid-row: span 3; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(135deg, #f6d9a5, #e8962e); color: #fff; align-self: start; }
.card .avatar .ico { width: 30px; height: 30px; }
.card .title { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.card .title b { font-family: var(--display); font-size: 16px; }
.card .title .latin { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }
.card .rename { border: 0; background: rgba(35, 48, 31, .07); border-radius: 8px; width: 26px; height: 26px; display: grid; place-items: center; cursor: pointer; }
.card .rename .ico { width: 14px; height: 14px; color: var(--ink-soft); }
.card input.name-edit { font: 800 15px var(--body); border: 1px solid rgba(35, 48, 31, .2); border-radius: 10px; padding: 4px 8px; width: 160px; background: #fff; }
.friend { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--ink-soft); flex-wrap: wrap; }
.hearts { display: flex; gap: 2px; }
.hearts .ico { width: 16px; height: 16px; }
.diet { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.diet b { color: var(--ink); }
.needs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.need { min-width: 0; }
.need .lbl { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 11px; font-weight: 800; color: var(--ink-soft); }
.need .lbl span { display: flex; align-items: center; gap: 4px; }
.need .lbl .ico { width: 14px; height: 14px; }
.need .lbl i { font-style: normal; font-variant-numeric: tabular-nums; }
.bar { height: 7px; border-radius: 4px; background: rgba(35, 48, 31, .12); overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; border-radius: 4px; transition: width .5s ease, background .5s; }
.actions { display: flex; gap: 10px; }
.act { position: relative; width: 92px; border: 0; border-radius: 20px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 900; font-size: 13px; cursor: pointer; transition: transform .12s, opacity .2s; }
.act .ico { width: 30px; height: 30px; color: var(--amber-deep); }
.act:active { transform: scale(.94); }
.act[disabled] { opacity: .45; cursor: default; }
.act .hint { font-size: 10.5px; color: var(--ink-soft); font-weight: 800; display: flex; align-items: center; gap: 2px; }
.act .hint .ico { width: 12px; height: 12px; }
.act.need-it::after { content: ""; position: absolute; top: 6px; right: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 3px rgba(212, 85, 60, .25); }
.round { width: 58px; height: 58px; border-radius: 20px; border: 0; display: grid; place-items: center; cursor: pointer; }
.round .ico { width: 28px; height: 28px; color: var(--amber-deep); }

/* food picker */
.foods { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: min(540px, calc(100vw - 24px)); border-radius: 22px; padding: 12px; z-index: 12; }
.foods h3 { margin: 0 0 8px; font-family: var(--display); font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.foods h3 small { font-family: var(--body); font-weight: 700; color: var(--ink-soft); font-size: 12px; }
.food-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.food { border: 1px solid rgba(35, 48, 31, .1); background: rgba(255, 255, 255, .75); border-radius: 16px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font-weight: 800; font-size: 12px; min-width: 0; }
.food .ico { width: 30px; height: 30px; }
.food small { display: flex; align-items: center; gap: 2px; color: var(--ink-soft); font-weight: 800; }
.food small .ico { width: 12px; height: 12px; }
.food.treat { background: linear-gradient(135deg, #fff3d6, #ffe0a6); }
.food[disabled] { opacity: .4; cursor: default; }
.food.empty { opacity: .55; }
.bubble.res { width: 40px; height: 40px; border: 0; cursor: pointer; padding: 0; background: linear-gradient(135deg, #f4ffe9, #d9f1c4); }
.bubble.res .ico { width: 24px; height: 24px; }
.dock button.bump .ico { animation: bump .45s ease; }
.fishing { position: fixed; z-index: 12; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 12px); transform: translateX(-50%); width: min(380px, calc(100vw - 32px)); border-radius: 22px; padding: 14px 16px; background: var(--glass-strong); display: grid; gap: 10px; text-align: center; }
body.fishing-on .hud-bottom { opacity: 0; pointer-events: none; transition: opacity .25s; }
.fishing .ttl { display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--display); font-size: 16px; }
.fishing .ttl .ico { width: 24px; height: 24px; }
.fishing p { margin: 0; font-weight: 700; color: var(--ink-soft); line-height: 1.4; }
.fishing .hook { justify-content: center; font-size: 18px; padding: 14px; background: #8aa2ad; }
.fishing .hook.hot { background: var(--amber); animation: bump .5s ease infinite; }
.fishing .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fishing small { display: flex; align-items: center; gap: 4px; font-weight: 800; color: var(--ink-soft); }
.fishing small .ico { width: 18px; height: 18px; }
body.fp .hud-bottom, body.fp .dock, body.fp .coach { display: none; }
#fp-ui .fp-exit { position: fixed; z-index: 13; left: max(12px, env(safe-area-inset-left)); top: calc(env(safe-area-inset-top) + 150px); border: 0; border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 6px; font-weight: 900; cursor: pointer; }
#fp-ui .fp-exit .ico { width: 20px; height: 20px; color: var(--amber-deep); }
#fp-ui .fp-hint { position: fixed; z-index: 13; left: 50%; top: calc(env(safe-area-inset-top) + 86px); transform: translateX(-50%); width: min(520px, calc(100vw - 32px)); border-radius: 16px; padding: 10px 14px; text-align: center; font-weight: 800; font-size: 13px; color: var(--ink-soft); transition: opacity .6s; }
#fp-ui .fp-hint.gone { opacity: 0; pointer-events: none; }
#fp-ui .fp-cross { position: fixed; z-index: 4; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: rgba(255, 255, 255, .85); box-shadow: 0 0 0 2px rgba(0, 0, 0, .18); pointer-events: none; }
#fp-ui .fp-joy { position: fixed; z-index: 13; left: max(24px, env(safe-area-inset-left)); bottom: calc(env(safe-area-inset-bottom) + 24px); width: 132px; height: 132px; border-radius: 50%; background: rgba(255, 255, 255, .28); border: 2px solid rgba(255, 255, 255, .6); backdrop-filter: blur(6px); touch-action: none; display: grid; place-items: center; }
#fp-ui .fp-joy .knob { width: 58px; height: 58px; border-radius: 50%; background: var(--glass-strong); box-shadow: var(--shadow); pointer-events: none; transition: transform .05s; }
#fp-ui .fp-act { position: fixed; z-index: 13; right: max(24px, env(safe-area-inset-right)); bottom: calc(env(safe-area-inset-bottom) + 44px); border: 0; border-radius: 22px; padding: 14px 20px; display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 16px; color: #fff; background: var(--amber); box-shadow: var(--shadow); cursor: pointer; }
#fp-ui .fp-act .ico { width: 28px; height: 28px; background: #fff; border-radius: 10px; padding: 3px; }
#fp-ui .fp-act[disabled] { background: #9aa39a; cursor: default; }
body.fishing-on #fp-ui .fp-joy, body.fishing-on #fp-ui .fp-act { display: none; }
.dock button.walk .ico { color: var(--amber-deep); }
.act { width: 70px; padding: 7px 4px 6px; border-radius: 16px; font-size: 11.5px; gap: 2px; }
.act .ico { width: 24px; height: 24px; }
.act .hint { display: none; }
.actions.off { display: none; }
.card { position: relative; }
.card.mini { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; width: auto; max-width: min(540px, 100%); }
.card.mini > .ico { width: 18px; height: 18px; color: var(--amber-deep); }
.card.mini b { font-family: var(--display); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34vw; }
.minis { display: flex; gap: 8px; align-items: center; }
.mn { display: flex; align-items: center; gap: 3px; }
.mn .ico { width: 15px; height: 15px; }
.mn i, .fa-need i { display: block; width: 26px; height: 6px; border-radius: 3px; background: rgba(35, 48, 31, .12); overflow: hidden; }
.mn u, .fa-need u { display: block; height: 100%; }
.mn.low .ico { animation: bump 1s ease infinite; }
.card .more { border: 0; background: rgba(35, 48, 31, .07); border-radius: 10px; width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; flex: none; color: var(--ink-soft); }
.card .more .ico { width: 18px; height: 18px; }
.card:not(.mini) .more { position: absolute; top: 8px; right: 8px; }
.bubble.res { width: 32px; height: 32px; }
.bubble.res .ico { width: 18px; height: 18px; }
#photo-card { position: fixed; z-index: 31; right: max(12px, env(safe-area-inset-right)); top: calc(env(safe-area-inset-top) + 66px); display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 18px; transform: translateX(calc(100% + 30px)); transition: transform .35s cubic-bezier(.2, .8, .2, 1); pointer-events: none; background: var(--glass-strong); box-shadow: var(--shadow); }
#photo-card.show { transform: none; }
#photo-card .pic { width: 64px; height: 40px; flex: none; }
#photo-card b { display: block; font-family: var(--display); font-size: 14px; }
#photo-card span { font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.fishing .catch-pic { width: 120px; height: 75px; justify-self: center; }
.finds { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.find { border-radius: 14px; background: rgba(255, 255, 255, .6); padding: 8px; display: grid; justify-items: center; gap: 2px; text-align: center; }
.find .pic { width: 72px; height: 45px; }
.find b { font-size: 12.5px; }
.find small { font-size: 11px; color: var(--ink-soft); font-weight: 700; }
.find.unknown .pic { filter: brightness(0) opacity(.25); }
/* walk mode */
body.fp .hud-top { display: none; }
body.fp #overlay .tag { display: none; }
body.fp .hud-top { align-items: flex-end; }
body.fp .res { justify-content: flex-end; }
#fp-ui .fp-exit { top: calc(env(safe-area-inset-top) + 12px); }
#fp-ui .fp-hint { top: calc(env(safe-area-inset-top) + 104px); }
#fp-ui .fp-compass { position: fixed; z-index: 12; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 60px); width: min(380px, calc(100vw - 32px)); height: 34px; border-radius: 17px; background: rgba(255, 255, 255, .55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, .75); overflow: hidden; pointer-events: none; }
.fc-n { position: absolute; left: 50%; top: 5px; bottom: 5px; width: 2px; background: rgba(35, 48, 31, .35); }
.fc-i { position: absolute; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 2px; }
.fc-i .ico { width: 20px; height: 20px; }
.fc-i.an .ico { color: var(--amber-deep); width: 22px; height: 22px; }
.fc-i em { font-style: normal; font-size: 10px; font-weight: 900; color: var(--ink-soft); }
.fc-i.edge .ico { width: 14px; height: 14px; }
#fp-ui .fp-bag { position: fixed; z-index: 12; left: max(12px, env(safe-area-inset-left)); top: calc(env(safe-area-inset-top) + 104px); display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; border-radius: 14px; pointer-events: none; }
#fp-ui .fp-bag span { display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: 13px; font-variant-numeric: tabular-nums; }
#fp-ui .fp-bag .ico { width: 18px; height: 18px; }
#fp-ui .fp-label { position: fixed; z-index: 11; left: 0; top: 0; transform: translate(-50%, -100%); padding: 4px 10px; border-radius: 10px; background: rgba(30, 40, 24, .72); color: #fff; font-weight: 800; font-size: 13px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s; }
#fp-ui .fp-animal { position: fixed; z-index: 13; right: max(14px, env(safe-area-inset-right)); bottom: calc(env(safe-area-inset-bottom) + 18px); width: min(320px, calc(100vw - 182px)); border-radius: 20px; padding: 10px; display: grid; gap: 8px; background: var(--glass-strong); box-shadow: var(--shadow); }
#fp-ui .fp-animal[hidden] { display: none; }
.fa-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.fa-head b { font-family: var(--display); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.fa-needs { display: flex; gap: 5px; flex: none; }
.fa-need { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.fa-need .ico { width: 14px; height: 14px; }
.fa-need i { width: 20px; height: 5px; }
.fa-acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.fa-acts button, .fa-foods button { border: 0; border-radius: 14px; padding: 7px 4px; background: rgba(255, 255, 255, .85); display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 900; font-size: 11.5px; cursor: pointer; position: relative; min-width: 0; }
.fa-acts .ico { width: 24px; height: 24px; color: var(--amber-deep); }
.fa-acts button.need::after { content: ""; position: absolute; top: 5px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.fa-acts button[disabled] { opacity: .45; cursor: default; }
.fa-foods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.fa-foods .ico { width: 24px; height: 24px; }
.fa-foods small { font-size: 10px; color: var(--ink-soft); font-weight: 800; }
.fa-foods button.empty { opacity: .5; }
.fa-foods button.back { font-size: 16px; }
#rotate { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; background: radial-gradient(120% 80% at 50% 0%, #4f7a45 0%, #2c4a2c 60%, #1f3320 100%); color: #f4ecd8; text-align: center; animation: rot-in .4s ease; }
#rotate[hidden] { display: none; }
@keyframes rot-in { from { opacity: 0; } }
.rot-box { display: grid; justify-items: center; gap: 14px; max-width: 320px; }

    items.push({ p: a.root.position, ic: 'i-paw', cls: 'an', label: nameOf(a.id) });
  }
  for (const h of harvest) if (harvestReady(h)) items.push({ p: h.anchor, ic: GATHER[h.kind].icon, cls: 'src' });
  const html = [];
  for (const it of items) {
    const d = Math.hypot(f.pos.x - it.p.x, f.pos.z - it.p.z); if (d < 1.2) continue;
    const rel = Math.atan2(Math.sin(yawTo(f.pos, it.p) - f.yaw), Math.cos(yawTo(f.pos, it.p) - f.yaw));
    const edge = Math.abs(rel) > 1.3;
    const x = edge ? (rel > 0 ? 2 : 98) : 50 - rel / 1.3 * 48;
    html.push(`<span class="fc-i ${it.cls}${edge ? ' edge' : ''}" style="left:${x.toFixed(1)}%;opacity:${Math.max(0.35, 1 - d / 16).toFixed(2)}">${svg(it.ic)}${it.cls === 'an' && !edge ? `<em>${Math.round(d)} м</em>` : ''}</span>`);
  }
  $('fp-compass').innerHTML = '<span class="fc-n"></span>' + html.join('');

  $('fp-bag').innerHTML = ['berries', 'grass', 'worms', 'fish'].map((k) => `<span>${svg(FOODS[k].icon)}${S.pantry[k] || 0}</span>`).join('');

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const HOME_TARGET = new THREE.Vector3(0, 0.6, 0);
const clock = new THREE.Clock(); let needTick = 0; let frameCount = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.12); frameCount++;
  // camera eases toward the selected animal and back to the island centre
  const goal = focusGoal === 'follow' && selected ? new THREE.Vector3(selected.root.position.x * 0.7, 0.6, selected.root.position.z * 0.7) : focusGoal === 'home' ? HOME_TARGET : null;
  if (goal && !fp) {
    const d = goal.clone().sub(controls.target).multiplyScalar(Math.min(1, dt * 2.5));
    controls.target.add(d); camera.position.add(d);
    if (focusGoal === 'home' && controls.target.distanceTo(HOME_TARGET) < 0.02) focusGoal = null;
  }
  if (fp) fpUpdate(dt); else controls.update();
  for (const a of animals) updateAnimal(a, dt);
  separate();
  if (selected) { selRing.position.set(selected.root.position.x, selected.root.position.y + 0.04, selected.root.position.z); ringMat.opacity = 0.6 + Math.sin(performance.now() / 250) * 0.25; }
  updateParticles(dt); updateProps(dt); updateHarvest(); updateFishing(dt);
  const tt = performance.now() / 1000;
  const night = updateDay(); animateWater(tt); animateSway(tt); animateClouds(dt); animateMotes(tt, night);
  if (waterfall && Math.random() < dt * 6) burst(waterfall.splash, 0xd7f0fa, 1, 'drop');
  needTick += dt;
  if (needTick > 1) {
    for (const k of S.unlocked) {
      const n = S.needs[k];
      for (const m in DECAY) {
        let d = DECAY[m];
        if (m === 'mood' && (n.food < 30 || n.water < 30)) d *= 2;       // hungry or thirsty animals get sad faster
        const sleeping = animals.some((x) => x.id === k && x.state === 'sleep');
        if (sleeping) d *= 0.3;                                        // sleeping animals barely get hungry
        n[m] = Math.max(0, n[m] - d / 60 * needTick);
      }
    }
    needTick = 0; if (selected) renderCard(); renderActions(); renderHUD(); renderClock();
  }
  updateOverlays();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

    const from = new URLSearchParams(location.search).get('from'); const fa = from && animals.find((x) => x.id === from);
    if (fa) setTimeout(() => { select(fa); toast(`${nameOf(fa.id)} ждёт тебя в заповеднике!`); }, 900);
    $('loading').style.opacity = 0; setTimeout(showRotateHint, 500); setTimeout(() => $('loading').remove(), 700);
    renderCoach(); renderClock();
    const daily = checkDaily(); save(); renderHUD();
    if (daily && S.tut >= 3) { window.__daily = daily; setTimeout(() => openPanel('daily'), 900); }
    frame();
    if (window.Profile && !PLAYER) Profile.ensure(() => location.reload());
  } catch (e) {
    console.error(e); txt.textContent = 'Не удалось загрузить заповедник. Обнови страницу.';
  }
})();
</script>
